<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대룡중 교복 3차 투표</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#f4f6f9;--ink:#14213d;--sub:#667085;--line:#e4e7ec;--pri:#2855d8;--pri-soft:#e8eefc}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;padding-bottom:120px;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
select,textarea{font:inherit}
.hidden{display:none!important}
.wrap{max-width:900px;margin:0 auto;padding:0 14px}

header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.hd{display:flex;align-items:center;gap:8px;height:54px}
.hd h1{font-size:16px;font-weight:900}
.hd .sp{flex:1}
.pill{font-size:11.5px;padding:4px 9px;border-radius:99px;background:#fff4e5;color:#b45309;font-weight:800}
.prog{height:5px;background:#eef1f5}
.prog i{display:block;height:100%;background:var(--pri);width:0;transition:.25s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;border-radius:12px;font-weight:800;background:var(--pri);color:#fff}
.btn.line{background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:700}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}

.intro{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin:16px 0 12px}
.intro h2{font-size:19px;margin-bottom:7px}
.intro p{color:var(--sub);line-height:1.65;font-size:14px}
.intro b{color:var(--ink)}
.note{background:#fff8e6;border:1px solid #f5d98a;color:#8a5a00;border-radius:12px;padding:11px 14px;font-size:13.5px;line-height:1.6}

section.q{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 16px 16px;margin-top:16px}
section.q.done{border-color:#bcd0f7;box-shadow:0 0 0 3px var(--pri-soft)}
.qh{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.qh h3{font-size:18px;font-weight:900}
.qh .chk{margin-left:auto;font-size:13px;font-weight:800;color:var(--pri);opacity:0}
section.q.done .chk{opacity:1}
.qd{color:var(--sub);font-size:13.5px;line-height:1.6;margin-top:6px}

.tabs{display:flex;gap:6px;justify-content:center;margin:12px 0 10px}
.tab{padding:7px 15px;border-radius:99px;background:#fbfcfe;border:1px solid var(--line);font-weight:800;font-size:13px;color:var(--sub)}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.opt{border:3px solid var(--line);border-radius:16px;background:#fff;padding:9px 9px 13px;text-align:center;position:relative;transition:.12s}
.opt:hover{border-color:#b9c6e8}
.opt.on{border-color:var(--pri);background:var(--pri-soft);box-shadow:0 6px 20px rgba(40,85,216,.16)}
.opt .ph{background:#f3f4f6;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;aspect-ratio:620/1670;max-height:min(56vh,520px)}
.opt .ph img{width:100%;height:100%;object-fit:contain;display:block}
.opts.leg .opt .ph{aspect-ratio:620/930;max-height:min(40vh,380px)}
.opts.q2 .opt .ph{aspect-ratio:620/760;max-height:min(46vh,420px);background:#fff}
.opt .tag{display:inline-block;margin-top:10px;font-size:18px;font-weight:900;letter-spacing:-.4px}
.opt .ds{display:block;margin-top:3px;font-size:13px;color:var(--sub);font-weight:700;line-height:1.45}
.opt .mark{position:absolute;top:9px;right:9px;width:31px;height:31px;border-radius:50%;background:var(--pri);color:#fff;font-weight:900;display:none;align-items:center;justify-content:center;font-size:17px}
.opt.on .mark{display:flex}
.cap{font-size:12px;color:#98a2b3;text-align:center;margin-top:9px;line-height:1.5}

.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-top:16px}
.card h3{font-size:16px;margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row label{flex:1;min-width:130px;font-size:13px;color:var(--sub);font-weight:700}
select{width:100%;margin-top:5px;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fbfcfe}
textarea{width:100%;margin-top:5px;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fbfcfe;resize:vertical;min-height:70px;line-height:1.5}

.foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:11px 14px;z-index:40}
.foot .in{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:12px}
.foot .st{font-size:13.5px;color:var(--sub);font-weight:700}
.foot .btn{flex:0 0 auto;margin-left:auto;padding:13px 26px}

.done-screen{background:#fff;border:1px solid var(--line);border-radius:18px;padding:46px 22px;text-align:center;margin-top:22px}
.done-screen .big{font-size:52px}
.done-screen h2{font-size:23px;margin:10px 0 8px}
.done-screen p{color:var(--sub);line-height:1.7}

.modal{position:fixed;inset:0;background:rgba(10,15,30,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:14px}
.modal .box{background:#fff;border-radius:18px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:20px}
.modal h3{font-size:18px;margin-bottom:12px}
.rs{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.rs img{width:42px;height:56px;object-fit:contain;background:#f3f4f6;border-radius:8px}
.rs .nm{width:60px;font-weight:900;font-size:13.5px}
.rs .bar{flex:1;height:20px;background:#eef1f5;border-radius:99px;overflow:hidden}
.rs .bar i{display:block;height:100%;background:var(--pri)}
.rs .n{width:90px;text-align:right;font-weight:800;font-size:13px}
.sm2{font-size:13px;color:var(--sub);line-height:1.7}
.sm2 h4{font-size:14.5px;color:var(--ink);margin:16px 0 8px}
.cmts{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;font-size:13px;line-height:1.6;color:#344054}
.cmts div{padding:5px 0;border-bottom:1px dashed var(--line)}

.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(14px);background:#14213d;color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:70}
.toast.show{opacity:1;transform:translateX(-50%)}

@media(max-width:560px){
  .opts{gap:8px}
  .opt{padding:7px 7px 11px;border-width:2px;border-radius:14px}
  .opt .tag{font-size:16px;margin-top:8px}
  .opt .ds{font-size:11.5px}
  section.q{padding:15px 12px 13px}
  .intro{padding:15px 16px}
  .foot .btn{padding:12px 20px}
}
</style>
</head>
<body>

<header>
  <div class="wrap hd">
    <h1>교복 3차 투표</h1>
    <span class="pill hidden" id="localPill">로컬 모드</span>
    <span class="sp"></span>
    <button class="btn line sm hidden" id="btnAdmin">⚙ 결과</button>
  </div>
  <div class="prog"><i id="progBar"></i></div>
</header>

<div class="wrap" id="main">
  <div class="intro">
    <h2>마지막 두 가지만 정해 주세요</h2>
    <p>교복선정위원회 1차 회의에서 <b>두 가지</b>는 학생 투표로 정하기로 했어요.<br>
    각 문항에서 <b>하나씩</b> 골라 제출해 주세요.</p>
  </div>
  <div class="note">※ 한 사람당 <b>한 번</b>만 투표할 수 있어요. 두 문항 모두 골라야 제출됩니다.</div>

  <div id="qs"></div>

  <div class="card">
    <h3>간단한 정보</h3>
    <div class="row">
      <label>학년
        <select id="vGrade"><option value="">선택</option><option>1</option><option>2</option><option>3</option></select>
      </label>
      <label>성별
        <select id="vGender"><option value="">선택</option><option>남</option><option>여</option></select>
      </label>
    </div>
  </div>

  <div class="card">
    <h3>하고 싶은 말 <span style="font-size:13px;color:#98a2b3;font-weight:600">(안 써도 돼요)</span></h3>
    <textarea id="vMemo" maxlength="200" placeholder="고른 이유나 바라는 점을 자유롭게 적어 주세요"></textarea>
  </div>
</div>

<div class="foot"><div class="in">
  <span class="st" id="stat">0 / 2 선택</span>
  <button class="btn" id="btnSubmit">제출하기</button>
</div></div>

<div class="modal hidden" id="mAdmin"><div class="box">
  <h3>3차 투표 결과</h3>
  <div id="resBody" class="sm2">불러오는 중…</div>
  <div style="display:flex;gap:8px;margin-top:16px">
    <button class="btn line sm" id="btnRefresh">새로고침</button>
    <button class="btn line sm" id="btnCsv">CSV 내려받기</button>
    <button class="btn sm" data-close style="margin-left:auto">닫기</button>
  </div>
</div></div>

<div class="toast" id="toast"></div>

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t.trim())))].map(b=>b.toString(16).padStart(2,"0")).join("");
const store={get(k,d){try{const v=localStorage.getItem("uf3_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("uf3_"+k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2300)}
let deviceId=store.get("device",null); if(!deviceId){deviceId=crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2);store.set("device",deviceId)}

let db=null,fs=null;
async function initFirebase(){
  if(!CONFIG.FIREBASE.apiKey){$("#localPill").classList.remove("hidden");return}
  try{
    const app=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    fs=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    db=fs.getFirestore(app.initializeApp(CONFIG.FIREBASE));
  }catch(e){console.error(e);$("#localPill").classList.remove("hidden");toast("연결 실패 — 이 기기에만 저장돼요")}
}
async function save(v){
  if(db){await fs.setDoc(fs.doc(db,CONFIG.COLLECTION,deviceId),v);return}
  const all=store.get("res",{});all[deviceId]=v;store.set("res",all);
}
async function load(){
  if(db){const q=await fs.getDocs(fs.collection(db,CONFIG.COLLECTION));const a=[];q.forEach(d=>a.push(d.data()));return a}
  return Object.values(store.get("res",{}));
}

let view=store.get("view","full");
const pick=store.get("pick",{});

function render(){
  $("#qs").innerHTML=QS.map(q=>`
    <section class="q ${pick[q.id]?"done":""}" id="q_${q.id}">
      <div class="qh"><h3>${esc(q.title)}</h3><span class="chk">✓ 선택 완료</span></div>
      <div class="qd">${q.desc}</div>
      ${q.views?`<div class="tabs">
        <button class="tab ${view==="full"?"on":""}" data-view="full">전신 보기</button>
        <button class="tab ${view==="leg"?"on":""}" data-view="leg">바지 크게 보기</button></div>`:""}
      <div class="opts ${q.views&&view==="leg"?"leg":""} ${q.views?"":"q2"}">
        ${q.opts.map(o=>`
          <button class="opt ${pick[q.id]===o.id?"on":""}" data-q="${q.id}" data-o="${o.id}">
            <span class="mark">✓</span>
            <div class="ph"><img src="${q.views&&view==="leg"?o.leg:o.full}" alt="${esc(o.name)}"></div>
            <span class="tag">${esc(o.name)}</span><span class="ds">${o.desc}</span>
          </button>`).join("")}
      </div>
      <div class="cap">${q.cap}</div>
    </section>`).join("");
  upd();
}
function upd(){
  const n=QS.filter(q=>pick[q.id]).length;
  $("#stat").textContent=`${n} / ${QS.length} 선택`;
  $("#progBar").style.width=(n/QS.length*100)+"%";
  QS.forEach(q=>$("#q_"+q.id)?.classList.toggle("done",!!pick[q.id]));
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-view]");
  if(t){view=t.dataset.view;store.set("view",view);render();return}
  const b=e.target.closest("[data-q]");
  if(b){
    pick[b.dataset.q]=b.dataset.o;store.set("pick",pick);
    $$(`[data-q="${b.dataset.q}"]`).forEach(x=>x.classList.toggle("on",x===b));
    upd();
    const i=QS.findIndex(q=>q.id===b.dataset.q),nx=QS.slice(i+1).find(q=>!pick[q.id]);
    if(nx)setTimeout(()=>$("#q_"+nx.id).scrollIntoView({behavior:"smooth",block:"start"}),260);
    return;
  }
  const c=e.target.closest("[data-close]");
  if(c){c.closest(".modal").classList.add("hidden")}
});

$("#btnSubmit").onclick=async()=>{
  const miss=QS.find(q=>!pick[q.id]);
  if(miss){toast("아직 안 고른 문항이 있어요");$("#q_"+miss.id).scrollIntoView({behavior:"smooth",block:"center"});return}
  if(!$("#vGrade").value||!$("#vGender").value){toast("학년과 성별을 선택해 주세요");return}
  const v={pants:pick.pants,pe:pick.pe,grade:$("#vGrade").value,gender:$("#vGender").value,memo:$("#vMemo").value.trim().slice(0,200),ts:Date.now()};
  try{
    $("#btnSubmit").disabled=true;
    await save(v);
    $("#main").innerHTML=`<div class="done-screen"><div class="big">🎉</div><h2>제출 완료!</h2>
      <p>동복 바지 <b>${esc(v.pants)}안</b> · 하복 체육복 <b>${esc(v.pe)}안</b>에 투표했어요.<br>소중한 의견 고마워요 — 결과는 교복선정위원회에서 함께 살펴볼 거예요.</p>
      <p style="margin-top:16px"><button class="btn line" onclick="location.reload()">내 선택 다시 보기 / 고치기</button></p></div>`;
    document.querySelector(".foot").classList.add("hidden");
    window.scrollTo(0,0);
  }catch(e){console.error(e);toast("제출 실패 — 잠시 후 다시 해 주세요")}
  finally{$("#btnSubmit").disabled=false}
};

let last=[];
$("#btnAdmin").onclick=()=>{$("#mAdmin").classList.remove("hidden");renderRes()};
$("#btnRefresh").onclick=()=>renderRes();
async function renderRes(){
  $("#resBody").innerHTML="불러오는 중…";
  try{last=await load()}catch(e){$("#resBody").innerHTML="결과를 불러오지 못했어요. Firestore 규칙을 확인하세요.";return}
  const V=last,N=V.length;
  let h=`<div>제출 <b>${N}</b>건 · 학년 ${[1,2,3].map(g=>V.filter(v=>v.grade==String(g)).length).join("·")} · 남 ${V.filter(v=>v.gender==="남").length} / 여 ${V.filter(v=>v.gender==="여").length}${db?"":" · 로컬 모드(이 기기만)"}</div>`;
  for(const q of QS){
    const cnt={};q.opts.forEach(o=>cnt[o.id]=V.filter(v=>v[q.id]===o.id).length);
    const max=Math.max(1,...Object.values(cnt));
    h+=`<h4>${esc(q.title)}</h4>`;
    h+=q.opts.map(o=>`<div class="rs"><img src="${o.full}"><div class="nm">${esc(o.name.split(" ")[0])}</div>
      <div class="bar"><i style="width:${cnt[o.id]/max*100}%"></i></div>
      <div class="n">${cnt[o.id]}표 <span style="color:#98a2b3">${N?Math.round(cnt[o.id]/N*100):0}%</span></div></div>`).join("");
    h+=`<div style="font-size:12.5px">`;
    for(const g of ["1","2","3"]){const s=V.filter(v=>v.grade===g);h+=`${g}학년(${s.length}) ${q.opts.map(o=>o.id+" "+s.filter(v=>v[q.id]===o.id).length).join(" / ")} &nbsp; `}
    h+=`<br>`;
    for(const g of ["남","여"]){const s=V.filter(v=>v.gender===g);h+=`${g}(${s.length}) ${q.opts.map(o=>o.id+" "+s.filter(v=>v[q.id]===o.id).length).join(" / ")} &nbsp; `}
    h+=`</div>`;
  }
  const memos=V.filter(v=>v.memo);
  if(memos.length)h+=`<div class="cmts"><b>학생 한마디 ${memos.length}건</b>${memos.map(v=>`<div>[바지 ${esc(v.pants)} · 체육복 ${esc(v.pe)}] ${esc(v.memo)}</div>`).join("")}</div>`;
  $("#resBody").innerHTML=h;
}
$("#btnCsv").onclick=()=>{
  const rows=[["제출시각","동복바지","하복체육복","학년","성별","한마디"]].concat(last.map(v=>[new Date(v.ts).toLocaleString("ko-KR"),(v.pants||"")+"안",(v.pe||"")+"안",v.grade,v.gender,v.memo||""]));
  const csv="﻿"+rows.map(r=>r.map(x=>`"${String(x??"").replace(/"/g,'""')}"`).join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="교복3차투표.csv";a.click();
};

async function start(){
  const p=new URLSearchParams(location.search).get("admin");
  if(p && await sha(p)===CONFIG.ADMIN_HASH) $("#btnAdmin").classList.remove("hidden");
  render();
  await initFirebase();
}
start();
</script>
