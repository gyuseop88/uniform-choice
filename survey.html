<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대룡중 교복 최종 선호도 조사</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--bg:#f4f6f9;--ink:#14213d;--sub:#667085;--line:#e4e7ec;--pri:#2855d8;--pri-soft:#e8eefc;--acc:#e8505b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;padding-bottom:110px}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font:inherit}
.hidden{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;border-radius:12px;font-weight:800;background:var(--pri);color:#fff}
.btn.line{background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:700}
.btn.red{background:var(--acc)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}

header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.hd{display:flex;align-items:center;gap:10px;height:56px}
.hd h1{font-size:17px;font-weight:900;white-space:nowrap}
.hd .sp{flex:1}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;background:#fff4e5;color:#b45309;font-weight:700}
.prog{height:5px;background:#eef1f5}
.prog i{display:block;height:100%;background:var(--pri);width:0;transition:.25s}

.intro{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin:18px 0 20px}
.intro h2{font-size:20px;margin-bottom:8px}
.intro p{color:var(--sub);line-height:1.65;font-size:14.5px}
.intro b{color:var(--ink)}

section.q{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 20px 18px;margin-bottom:18px}
section.q.done{border-color:#bcd0f7;box-shadow:0 0 0 3px var(--pri-soft)}
.qh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.qh h3{font-size:21px;font-weight:900}
.qh .d{font-size:14px;color:var(--sub)}
.qh .chk{margin-left:auto;font-size:13px;font-weight:800;color:var(--pri);opacity:0}
section.q.done .chk{opacity:1}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:14px}
.opt{border:2px solid var(--line);border-radius:14px;padding:12px;background:#fbfcfe;text-align:left;position:relative;transition:.12s}
.opt:hover{border-color:#b9c6e8}
.opt.on{border-color:var(--pri);background:var(--pri-soft)}
.opt .ph{height:280px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:10px;overflow:hidden}
.opt .ph img{max-width:100%;max-height:100%;object-fit:contain}
.opt .ph.none{color:#98a2b3;font-size:14px;text-align:center;line-height:1.6;border:1px dashed #cfd4dc;padding:10px}
.opt .kind{display:inline-block;font-size:11px;font-weight:800;color:#fff;background:#64748b;border-radius:6px;padding:2px 7px;margin:10px 0 5px}
.opt .co{font-size:15px;font-weight:800}
.opt .no{font-size:12px;color:var(--sub)}
.opt .mark{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;border:2px solid #cfd4dc;background:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff}
.opt.on .mark{background:var(--pri);border-color:var(--pri)}

.foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 0;z-index:40;box-shadow:0 -4px 16px rgba(16,24,40,.06)}
.foot .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.foot .cnt{font-weight:800}
.foot .cnt em{font-style:normal;color:var(--pri)}
.foot select{padding:9px 11px;border:1px solid var(--line);border-radius:10px}
.foot .sp{flex:1}

.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.mbox{background:#fff;border-radius:18px;width:100%;max-width:900px;max-height:92vh;overflow:auto;padding:24px}
.mbox h2{font-size:19px;margin-bottom:14px;display:flex;gap:8px;align-items:center}
.mbox h2 .sp{flex:1}
.note{font-size:13px;color:var(--sub);background:#f8fafc;border-radius:10px;padding:10px 12px;line-height:1.6}
.res h3{font-size:16px;margin:16px 0 8px}
.row2{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.row2 img{width:44px;height:52px;object-fit:contain;background:#f3f4f6;border-radius:8px}
.row2 .nm{width:170px;font-size:14px;font-weight:700}
.row2 .bar{flex:1;height:10px;background:#eef1f5;border-radius:6px;overflow:hidden}
.row2 .bar i{display:block;height:100%;background:var(--pri)}
.row2 .n{width:74px;text-align:right;font-weight:800;font-size:14px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;z-index:90;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
.done-screen{text-align:center;padding:60px 20px}
.done-screen .big{font-size:56px}
.done-screen h2{font-size:26px;margin:10px 0 8px}
.done-screen p{color:var(--sub);line-height:1.7}
@media (max-width:640px){
  .opt .ph{height:210px}
  .qh h3{font-size:19px}
  .opts{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
}
</style>
</head>
<body>

<header>
  <div class="wrap hd">
    <h1>🗳️ 교복 최종 선호도 조사</h1>
    <span class="pill hidden" id="localPill">로컬 모드</span>
    <div class="sp"></div>
    <button class="btn line sm hidden" id="btnAdmin">⚙ 결과</button>
    </div>
  <div class="prog"><i id="progBar"></i></div>
</header>

<main class="wrap" id="main">
  <div class="intro">
    <h2>지난 투표에서 많은 표를 받은 디자인만 모았어요 👕</h2>
    <p>6개 항목에서 <b>각각 하나씩</b> 골라 주세요. 회사 이름은 가려져 있어요 (A사·B사·C사).<br>
    다 고르면 맨 아래 <b>제출하기</b> 버튼을 눌러 주세요. 이름·로그인 없이 바로 참여할 수 있고, <b>한 사람당 한 번</b>만 집계돼요.</p>
  </div>
  <div id="qs"></div>
</main>

<div class="foot">
  <div class="wrap">
    <span class="cnt"><em id="cntSel">0</em> / <span id="cntAll">6</span> 선택함</span>
    <select id="vGrade"><option value="">학년</option><option>1</option><option>2</option><option>3</option></select>
    <select id="vGender"><option value="">성별</option><option>남</option><option>여</option></select>
    <div class="sp"></div>
    <button class="btn red" id="btnSubmit">제출하기</button>
  </div>
</div>

<div class="modal hidden" id="mAdmin">
  <div class="mbox">
    <h2>⚙ 조사 결과<span class="sp"></span>
      <button class="btn line sm" id="btnCsv">CSV</button>
      <button class="btn line sm" id="btnRefresh">새로고침</button>
      <button class="btn line sm" data-close>닫기</button></h2>
    <div id="resBody" class="res"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

const COMPANIES={smart:{name:"스마트",blind:"A사"},elite:{name:"엘리트",blind:"B사"},skoolooks:{name:"스쿨룩스",blind:"C사"},now:{name:"현재 교복",blind:"현재 교복"}};
let BLIND = true;

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t.trim())))].map(b=>b.toString(16).padStart(2,"0")).join("");
const store={get(k,d){try{const v=localStorage.getItem("ufs_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("ufs_"+k,JSON.stringify(v))}catch(e){}}};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2300)}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let deviceId=store.get("device",null); if(!deviceId){deviceId=crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2);store.set("device",deviceId)}
const coLabel=co=>BLIND?COMPANIES[co].blind:COMPANIES[co].name;

let db=null,fs=null;
const FB_ON=!!CONFIG.FIREBASE.apiKey;
async function initFirebase(){
  if(!FB_ON){$("#localPill").classList.remove("hidden");return}
  try{
    const app=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    fs=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    db=fs.getFirestore(app.initializeApp(CONFIG.FIREBASE));
  }catch(e){console.error(e);$("#localPill").classList.remove("hidden");toast("연결 실패 — 이 기기에만 저장돼요")}
}
async function save(v){
  if(db){await fs.setDoc(fs.doc(db,CONFIG.COLLECTION,deviceId),v);return}
  const all=store.get("res",{});all[deviceId]=v;store.set("res",all);
}
async function load(){
  if(db){const q=await fs.getDocs(fs.collection(db,CONFIG.COLLECTION));const a=[];q.forEach(d=>a.push(d.data()));return a}
  return Object.values(store.get("res",{}));
}

const pick=store.get("pick",{});
function render(){
  $("#cntAll").textContent=CATS.length;
  $("#qs").innerHTML=CATS.map(c=>`
    <section class="q ${pick[c.id]?"done":""}" id="q_${c.id}">
      <div class="qh"><h3>${esc(c.title)}</h3><span class="d">${esc(c.desc)}</span><span class="chk">✓ 선택 완료</span></div>
      <div class="opts">${c.opts.map(o=>`
        <button class="opt ${pick[c.id]===o.id?"on":""}" data-c="${c.id}" data-o="${o.id}">
          <span class="mark">✓</span>
          <div class="ph ${o.src?"":"none"}">${o.src?`<img src="${o.src}" alt="">`:"사진은 곧 추가돼요<br>지금 입는 교복이에요"}</div>
          <span class="kind" style="background:${o.co==="now"?"#0f766e":"#64748b"}">${esc(o.kind)}</span>
          <div class="co">${esc(coLabel(o.co))}</div>
          <div class="no">${o.co==="now"?esc(o.note):esc(o.id)+" · "+esc(o.note)}</div>
        </button>`).join("")}</div>
    </section>`).join("");
  upd();
}
function upd(){
  const n=CATS.filter(c=>pick[c.id]).length;
  $("#cntSel").textContent=n;$("#progBar").style.width=(n/CATS.length*100)+"%";
  CATS.forEach(c=>$("#q_"+c.id)?.classList.toggle("done",!!pick[c.id]));
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-c],[data-close]");
  if(!b)return;
  if(b.dataset.close!==undefined){b.closest(".modal").classList.add("hidden");return}
  pick[b.dataset.c]=b.dataset.o;store.set("pick",pick);
  $$(`[data-c="${b.dataset.c}"]`).forEach(x=>x.classList.toggle("on",x===b));
  upd();
  const i=CATS.findIndex(c=>c.id===b.dataset.c),nx=CATS.slice(i+1).find(c=>!pick[c.id]);
  if(nx)setTimeout(()=>$("#q_"+nx.id).scrollIntoView({behavior:"smooth",block:"start"}),260);
});
$("#btnSubmit").onclick=async()=>{
  const miss=CATS.filter(c=>!pick[c.id]);
  if(miss.length){toast(`아직 ${miss.length}개 안 골랐어요`);$("#q_"+miss[0].id).scrollIntoView({behavior:"smooth",block:"center"});return}
  const v={...Object.fromEntries(CATS.map(c=>[c.id,pick[c.id]])),grade:$("#vGrade").value,gender:$("#vGender").value,ts:Date.now()};
  try{$("#btnSubmit").disabled=true;await save(v);store.set("sent",true);
    $("#main").innerHTML=`<div class="done-screen"><div class="big">🎉</div><h2>제출 완료!</h2>
      <p>소중한 의견 고마워요.<br>결과는 학생자치회와 교복선정위원회에서 함께 살펴볼 거예요.</p>
      <p style="margin-top:14px"><button class="btn line" onclick="location.reload()">내 선택 다시 보기 / 고치기</button></p></div>`;
    document.querySelector(".foot").classList.add("hidden");window.scrollTo(0,0);
  }catch(e){console.error(e);toast("제출 실패 — 잠시 후 다시 해 주세요")}
  finally{$("#btnSubmit").disabled=false}
};

$("#btnAdmin").onclick=async()=>{$("#mAdmin").classList.remove("hidden");renderRes()};
$("#btnRefresh").onclick=()=>renderRes();
let last=[];
async function renderRes(){
  $("#resBody").innerHTML="불러오는 중…";
  try{last=await load()}catch(e){$("#resBody").innerHTML="결과를 불러오지 못했어요. Firestore 규칙을 확인하세요.";return}
  const V=last;
  let h=`<div class="note">제출 <b>${V.length}</b>건 · 학년 ${[1,2,3].map(g=>V.filter(v=>v.grade==String(g)).length).join("·")} · 남 ${V.filter(v=>v.gender==="남").length} / 여 ${V.filter(v=>v.gender==="여").length}${db?"":" · 로컬 모드(이 기기만)"}</div>`;
  for(const c of CATS){
    const cnt={};V.forEach(v=>{if(v[c.id])cnt[v[c.id]]=(cnt[v[c.id]]||0)+1});
    const max=Math.max(1,...Object.values(cnt));
    h+=`<h3>${esc(c.title)}</h3>`;
    h+=c.opts.map(o=>({o,n:cnt[o.id]||0})).sort((a,b)=>b.n-a.n).map(({o,n})=>`
      <div class="row2">${o.src?`<img src="${o.src}">`:`<div style="width:44px;height:52px;background:#f3f4f6;border-radius:8px"></div>`}
        <div class="nm">${esc(COMPANIES[o.co].name)}<br><span style="font-weight:500;color:#667085;font-size:12px">${esc(o.id)}</span></div>
        <div class="bar"><i style="width:${n/max*100}%"></i></div>
        <div class="n">${n}표 <span style="color:#98a2b3;font-weight:600">${V.length?Math.round(n/V.length*100):0}%</span></div></div>`).join("");
  }
  $("#resBody").innerHTML=h;
}
$("#btnCsv").onclick=()=>{
  const rows=[["제출시각","학년","성별",...CATS.map(c=>c.title)]].concat(last.map(v=>[new Date(v.ts).toLocaleString("ko-KR"),v.grade,v.gender,...CATS.map(c=>v[c.id]||"")]));
  const csv="﻿"+rows.map(r=>r.map(x=>`"${String(x??"").replace(/"/g,'""')}"`).join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="교복최종선호도.csv";a.click();
};

async function start(){
  let admin=false;
  const p=new URLSearchParams(location.search).get("admin");
  if(p && await sha(p)===CONFIG.ADMIN_HASH) admin=true;
  if(admin){$("#btnAdmin").classList.remove("hidden");BLIND=false}
  render();await initFirebase();
}
start();
</script>
</body>
</html>
